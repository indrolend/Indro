name: Native verification evidence
on:
  push:
    branches: [feat/native-verification-evidence]
    paths:
      - 'packages/indro/native-verify*'
      - 'packages/indro/benchmark-native*'
      - '.github/workflows/native-verification.yml'
  pull_request:
    paths:
      - 'packages/indro/native-verify*'
      - 'packages/indro/benchmark-native*'
      - '.github/workflows/native-verification.yml'
jobs:
  native-ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/indro/native-verify.test.mjs packages/indro/benchmark-native.test.mjs
