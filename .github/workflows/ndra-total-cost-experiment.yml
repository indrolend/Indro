name: NDRA total-cost falsifier
on:
  pull_request:
    paths: ['.github/workflows/ndra-total-cost-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pinned INDRO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify existing NDRA safety and semantics
        run: python3 packages/indro/tools/test-ndra-repo-gauntlet.py
      - name: Compare full cost on disposable three-verdict repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, statistics, subprocess, sys, time
          
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "indro-ndra-m4"
          repo = root / "toolz"
          repo.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.run(["git", "-C", str(repo), *args], check=True, text=True, capture_output=True).stdout.strip()
          
          setup_start = time.perf_counter_ns()
          git("init", "-q")
          git("config", "user.email", "ndra-fixture@example.invalid")
          git("config", "user.name", "NDRA disposable fixture")
          git("remote", "add", "origin", "https://example.invalid/disposable/toolz.git")
          file = repo / "probe.py"
          file.write_text("def equivalent(x):\n    return x + 1\n\ndef divergent(x):\n    return x + 1\n\ndef unknown(x):\n    return external(x)\n", encoding="utf-8")
          git("add", "probe.py")
          git("commit", "-qm", "baseline: three bounded functions")
          before = git("rev-parse", "HEAD")
          file.write_text("def equivalent(x):\n    return (x + 1)\n\ndef divergent(x):\n    return x + 2\n\ndef unknown(x):\n    return external(x) + 1\n", encoding="utf-8")
          git("add", "probe.py")
          git("commit", "-qm", "change: equivalent, counterexample, unknown")
          after = git("rev-parse", "HEAD")
          assert not git("status", "--porcelain")
          fixture_setup_ns = time.perf_counter_ns() - setup_start
          
          output = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "ndra-m4-evidence"
          output.mkdir(exist_ok=True)
          cmd = [sys.executable, "packages/indro/tools/ndra_repo_gauntlet.py",
                 "--repos", "toolz", "--workspace", str(root), "--output", str(output),
                 "--history", "1", "--max-inputs", "256", "--trials", "15"]
          started = time.perf_counter_ns()
          completed = subprocess.run(cmd, check=True, capture_output=True, text=True)
          process_wall_ns = time.perf_counter_ns() - started
          report = json.loads((output / "results.json").read_text(encoding="utf-8"))
          verdicts = report["counts"]["verdicts"]
          assert verdicts == {"EQUIVALENT": 1, "COUNTEREXAMPLE": 1, "UNKNOWN": 1}, verdicts
          assert len(report["comparisons"]) == 3
          assert report["audit"]["false_skips"] == 0
          assert report["audit"]["all_changed_functions_accounted"]
          counterexample = next(r for r in report["comparisons"] if r["verdict"] == "COUNTEREXAMPLE")
          assert counterexample["witness"]["before"] != counterexample["witness"]["after"]
          unknown = next(r for r in report["comparisons"] if r["verdict"] == "UNKNOWN")
          assert "unsupported" in unknown["reason"]
          
          costs = {}
          for name, data in report["benchmark"].items():
              samples = data["samples"]
              assert len(samples) == 30, (name, len(samples))
              assert all(s["elapsed_ns"] > 0 and s["audit_ns_excluded"] >= 0 for s in samples)
              assert data["false_skips"] == 0
              if name == "full":
                  assert data["reuses"] == 0 and all(s["audit_ns_excluded"] == 0 for s in samples)
              else:
                  assert data["reuses"] > 0 and any(s["audit_ns_excluded"] > 0 for s in samples)
              inclusive = [s["elapsed_ns"] + s["audit_ns_excluded"] for s in samples]
              costs[name] = {
                  "samples": len(samples),
                  "reuses": data["reuses"],
                  "verification_evaluations": data["verification_evaluations"],
                  "reported_median_ms": round(statistics.median(s["elapsed_ns"] for s in samples) / 1e6, 5),
                  "inclusive_median_ms": round(statistics.median(inclusive) / 1e6, 5),
                  "total_excluding_audit_ms": round(sum(s["elapsed_ns"] for s in samples) / 1e6, 5),
                  "total_including_audit_ms": round(sum(inclusive) / 1e6, 5),
                  "audit_ms": round(sum(s["audit_ns_excluded"] for s in samples) / 1e6, 5),
              }
          
          baseline = costs["full"]["total_including_audit_ms"]
          for data in costs.values():
              data["inclusive_savings_vs_full_ms"] = round(baseline - data["total_including_audit_ms"], 5)
          
          summary = {
              "schema": "indro.ndra-total-cost-falsifier/v1",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "fixture": {"before": before, "after": after, "dirty": False, "comparison_count": 3},
              "controls": {"equivalent": True, "counterexample": True, "unknown": True, "false_skips": 0,
                           "audit_accounted": True},
              "cost_scope": "all 30 cold/warm samples per strategy include independent reuse audit; fixture creation and subprocess/parse/report overhead recorded separately, not attributed to one arm",
              "fixture_setup_ms": round(fixture_setup_ns / 1e6, 5),
              "whole_process_ms": round(process_wall_ns / 1e6, 5),
              "source_setup_ns_label_includes_benchmark": report["setup_ns"],
              "strategies": costs,
          }
          (output / "total-cost-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## NDRA bounded full-cost falsifier\n\n")
              f.write("All three verdicts verified; zero false skips. Independent audit cost included in the corrected comparison.\n\n")
              f.write("| Strategy | Reported median ms | Audit-inclusive median ms | Total audit-inclusive ms |\n")
              f.write("|---|---:|---:|---:|\n")
              for name, data in costs.items():
                  f.write(f"| {name} | {data['reported_median_ms']} | {data['inclusive_median_ms']} | {data['total_including_audit_ms']} |\n")
          PY
      - name: Retain raw report and audit-inclusive measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndra-m4-total-cost
          path: ndra-m4-evidence/
          if-no-files-found: warn
  real-repository-counterbalanced:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned INDRO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare audit-inclusive cost on pinned real Python histories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "indro-ndra-m4-real"
          root.mkdir(parents=True, exist_ok=True)
          evidence = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "ndra-m4-real-evidence"
          evidence.mkdir(exist_ok=True)
          sources = {
              "toolz": ("https://github.com/pytoolz/toolz.git", "451af60dec590a6010e2babdbf391ea8f815122f"),
              "boltons": ("https://github.com/mahmoud/boltons.git", "d31d821d56c8f7756af9c30a864077f2e5855321"),
          }
          setup_start = time.perf_counter_ns()
          for name, (url, sha) in sources.items():
              dest = root / name
              subprocess.run(["git", "clone", "--quiet", url, str(dest)], check=True, timeout=180)
              subprocess.run(["git", "-C", str(dest), "checkout", "--quiet", "--detach", sha], check=True)
              actual = subprocess.check_output(["git", "-C", str(dest), "rev-parse", "HEAD"], text=True).strip()
              assert actual == sha, (name, actual)
              assert not subprocess.check_output(["git", "-C", str(dest), "status", "--porcelain"], text=True).strip()
          clone_ms = (time.perf_counter_ns() - setup_start) / 1e6
          source = pathlib.Path("packages/indro/tools/ndra_repo_gauntlet.py").read_text()
          needle = 'for strategy in ("full","exact-cache","ndra-proof-reuse"):'
          assert source.count(needle) == 1, "benchmark strategy loop changed"
          orders = [
              ("full", "exact-cache", "ndra-proof-reuse"),
              ("exact-cache", "ndra-proof-reuse", "full"),
              ("ndra-proof-reuse", "full", "exact-cache"),
          ]
          rotations = []
          expected_semantics = None
          for index, order in enumerate(orders):
              script = root / f"ndra-rotation-{index}.py"
              script.write_text(source.replace(needle, f"for strategy in {order!r}:", 1))
              output = evidence / f"rotation-{index}"
              cmd = [sys.executable, str(script), "--repos", "toolz", "boltons",
                     "--workspace", str(root), "--output", str(output),
                     "--history", "20", "--max-inputs", "256", "--trials", "5"]
              start = time.perf_counter_ns()
              subprocess.run(cmd, check=True, capture_output=True, text=True, timeout=360)
              wall_ms = (time.perf_counter_ns() - start) / 1e6
              report = json.loads((output / "results.json").read_text())
              assert report["audit"]["false_skips"] == 0
              assert report["audit"]["all_changed_functions_accounted"]
              semantics = json.dumps([
                  {k: row.get(k) for k in ("repo", "before", "after", "function_before",
                      "function_after", "before_source_hash", "after_source_hash",
                      "verdict", "reason", "witness")}
                  for row in report["comparisons"]
              ], sort_keys=True)
              if expected_semantics is None:
                  expected_semantics = semantics
              else:
                  assert semantics == expected_semantics, "strategy order changed semantic results"
              metrics = {}
              for name, data in report["benchmark"].items():
                  samples = data["samples"]
                  assert len(samples) == 10 and data["false_skips"] == 0
                  assert all(s["elapsed_ns"] > 0 and s["audit_ns_excluded"] >= 0 for s in samples)
                  exclusive = sum(s["elapsed_ns"] for s in samples)
                  audit = sum(s["audit_ns_excluded"] for s in samples)
                  assert audit == data["audit_ns_excluded"]
                  metrics[name] = {
                      "sample_total_ms": round((exclusive + audit) / 1e6, 6),
                      "sample_audit_ms": round(audit / 1e6, 6),
                      "verification_evaluations": data["verification_evaluations"],
                      "reuses": data["reuses"],
                      "samples": len(samples),
                  }
              rotations.append({
                  "order": order, "wall_ms": round(wall_ms, 4),
                  "repo_parse_ms": round(sum(r["parse_ns"] for r in report["repositories"]) / 1e6, 4),
                  "script_setup_ms": round(report["setup_ns"] / 1e6, 4),
                  "comparisons": len(report["comparisons"]),
                  "exclusions": len(report["exclusions"]),
                  "verdicts": report["counts"]["verdicts"],
                  "strategies": metrics,
              })
          aggregate = {
              name: {
                  "sample_total_ms": round(sum(r["strategies"][name]["sample_total_ms"] for r in rotations), 6),
                  "sample_audit_ms": round(sum(r["strategies"][name]["sample_audit_ms"] for r in rotations), 6),
                  "evaluations": sum(r["strategies"][name]["verification_evaluations"] for r in rotations),
                  "reuses": sum(r["strategies"][name]["reuses"] for r in rotations),
              }
              for name in orders[0]
          }
          count = rotations[0]["comparisons"]
          status = "MEASURED" if count > 0 and aggregate["ndra-proof-reuse"]["reuses"] > 0 else "INSUFFICIENT_COMPARABLE_WORK"
          summary = {
              "schema": "indro.ndra-real-corpus-counterbalance/v1",
              "status": status, "source_commits": {k: v[1] for k, v in sources.items()},
              "history_per_repo": 20, "trials_per_rotation": 5,
              "cost_scope": "all timed benchmark samples include audit; clone, parsing, process startup and report output separately recorded, not allocated arbitrarily to strategies",
              "clone_ms": round(clone_ms, 4), "rotations": rotations, "aggregate": aggregate,
              "negative_controls": {
                  "semantic_result_mismatch_rejected": True,
                  "audit_reconciliation_required": True,
                  "false_skip_required_zero": True,
              },
              "limitations": [
                  "fixed pinned upstream histories; static AST interpreter, not application runtime",
                  "independent audit recomputes verification in the same implementation",
                  "three order rotations, each with five cold/warm trials; process setup is shared across arms",
                  "microbenchmark timings may not generalize to human investigation cost",
              ],
          }
          (evidence / "summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps({"status": status, "comparisons": count, "aggregate": aggregate,
                            "clone_ms": summary["clone_ms"], "wall_ms": [r["wall_ms"] for r in rotations]}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Pinned real-repository NDRA cost\n\n")
              f.write(f"Status: {status}; {count} comparisons; three counterbalanced orders. See artifact for limitations.\n\n")
              f.write("| Strategy | Audit-inclusive sample total ms | Audit ms | Evaluations | Reuses |\n|---|---:|---:|---:|---:|\n")
              for name, m in aggregate.items():
                  f.write(f"| {name} | {m['sample_total_ms']} | {m['sample_audit_ms']} | {m['evaluations']} | {m['reuses']} |\n")
          PY
      - name: Retain pinned real-repository measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndra-m4-real-repository-cost
          path: ndra-m4-real-evidence/
          if-no-files-found: warn

  real-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out pinned INDRO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify existing NDRA semantic and safety controls
        run: python3 packages/indro/tools/test-ndra-repo-gauntlet.py
      - name: Compare real upstream counterexample with audit-inclusive cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, runpy, subprocess, sys, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "indro-ndra-m4-counterexample"
          root.mkdir(parents=True, exist_ok=True)
          repo = root / "algorithms"
          sha = "a6831c898a12e568c2e611d457dd71bd89488ce2"
          start = time.perf_counter_ns()
          subprocess.run(["git", "clone", "--quiet", "https://github.com/TheAlgorithms/Python.git", str(repo)], check=True, timeout=180)
          subprocess.run(["git", "-C", str(repo), "checkout", "--quiet", "--detach", sha], check=True)
          def git(*args):
              return subprocess.check_output(["git", "-C", str(repo), *args], text=True).strip()
          assert git("rev-parse", "HEAD") == sha
          assert not git("status", "--porcelain")
          parent = git("rev-parse", "HEAD^")
          assert "maths/greatest_common_divisor.py" in git("diff", "--name-only", parent, sha)
          clone_ms = (time.perf_counter_ns() - start) / 1e6
          source = pathlib.Path("packages/indro/tools/ndra_repo_gauntlet.py").read_text()
          parser_needle = 'p.add_argument("--repos",nargs="+",choices=sorted(REPOS)'
          order_needle = 'for strategy in ("full","exact-cache","ndra-proof-reuse"):'
          assert source.count(parser_needle) == source.count(order_needle) == 1
          source = source.replace(parser_needle, 'p.add_argument("--repos",nargs="+",choices=sorted((*REPOS,"algorithms"))', 1)
          orders = [
              ("full", "exact-cache", "ndra-proof-reuse"),
              ("exact-cache", "ndra-proof-reuse", "full"),
              ("ndra-proof-reuse", "full", "exact-cache"),
          ]
          evidence = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "ndra-m4-counterexample-evidence"
          evidence.mkdir(exist_ok=True)
          rotations = []
          semantic_reference = None
          for index, order in enumerate(orders):
              script = root / f"ndra-order-{index}.py"
              script.write_text(source.replace(order_needle, f"for strategy in {order!r}:", 1))
              output = evidence / f"rotation-{index}"
              cmd = [sys.executable, str(script), "--repos", "algorithms",
                     "--workspace", str(root), "--output", str(output),
                     "--history", "1", "--max-inputs", "256", "--trials", "5"]
              started = time.perf_counter_ns()
              subprocess.run(cmd, check=True, capture_output=True, text=True, timeout=180)
              wall_ms = (time.perf_counter_ns() - started) / 1e6
              report = json.loads((output / "results.json").read_text())
              assert report["repositories"][0]["head"] == sha
              assert report["repositories"][0]["adjacent_pairs"] == 1
              assert report["audit"]["false_skips"] == 0
              assert report["audit"]["all_changed_functions_accounted"]
              rows = report["comparisons"]
              gcd = [r for r in rows if r["function_before"] == "greatest_common_divisor"
                     and r["function_after"] == "greatest_common_divisor"]
              assert len(gcd) == 1, gcd
              row = gcd[0]
              assert row["verdict"] == "COUNTEREXAMPLE", row
              assert row["witness"]["arguments"] == {"a": 0, "b": -2}, row["witness"]
              assert row["witness"]["before"] == {"kind": "return", "value": -2}
              assert row["witness"]["after"] == {"kind": "return", "value": 2}
              semantics = json.dumps([{k: r.get(k) for k in
                  ("repo", "before", "after", "function_before", "function_after",
                   "before_source_hash", "after_source_hash", "verdict", "reason", "witness")}
                  for r in rows], sort_keys=True)
              if semantic_reference is None:
                  semantic_reference = semantics
              else:
                  assert semantics == semantic_reference, "order changed semantic results"
              metrics = {}
              for name, data in report["benchmark"].items():
                  samples = data["samples"]
                  assert len(samples) == 10 and data["false_skips"] == 0
                  assert all(s["elapsed_ns"] > 0 and s["audit_ns_excluded"] >= 0 for s in samples)
                  audit = sum(s["audit_ns_excluded"] for s in samples)
                  assert audit == data["audit_ns_excluded"]
                  metrics[name] = {
                      "sample_total_ms": round(sum(s["elapsed_ns"] + s["audit_ns_excluded"] for s in samples) / 1e6, 6),
                      "sample_audit_ms": round(audit / 1e6, 6),
                      "evaluations": data["verification_evaluations"],
                      "reuses": data["reuses"],
                  }
              rotations.append({
                  "order": order, "wall_ms": round(wall_ms, 4),
                  "parse_ms": round(sum(r["parse_ns"] for r in report["repositories"]) / 1e6, 4),
                  "comparisons": len(rows), "verdicts": report["counts"]["verdicts"],
                  "gcd_witness": row["witness"], "strategies": metrics,
              })
          # Independent positive/negative observation controls: run only INDRO's
          # bounded interpreter on Git blobs; never import upstream code.
          safe = runpy.run_path(str(root / "ndra-order-0.py"), run_name="indro_audit")
          path = "maths/greatest_common_divisor.py"
          before_bytes = subprocess.check_output(["git", "-C", str(repo), "show", f"{parent}:{path}"])
          after_bytes = subprocess.check_output(["git", "-C", str(repo), "show", f"{sha}:{path}"])
          before = safe["parse_functions"](path, before_bytes)[0]["greatest_common_divisor"]
          after = safe["parse_functions"](path, after_bytes)[0]["greatest_common_divisor"]
          observe = safe["observe"]
          assert observe(before, (0, -2)) == {"kind": "return", "value": -2}
          assert observe(after, (0, -2)) == {"kind": "return", "value": 2}
          assert observe(before, (0, 2)) == observe(after, (0, 2)) == {"kind": "return", "value": 2}
          assert safe["compare_functions"](before, before, 256)["verdict"] == "EQUIVALENT"
          aggregate = {name: {
              "sample_total_ms": round(sum(r["strategies"][name]["sample_total_ms"] for r in rotations), 6),
              "audit_ms": round(sum(r["strategies"][name]["sample_audit_ms"] for r in rotations), 6),
              "evaluations": sum(r["strategies"][name]["evaluations"] for r in rotations),
              "reuses": sum(r["strategies"][name]["reuses"] for r in rotations),
          } for name in orders[0]}
          summary = {
              "schema": "indro.ndra-real-counterexample-cost/v1",
              "source": "TheAlgorithms/Python", "source_commit": sha, "parent_commit": parent,
              "source_file": path, "source_before_sha256": hashlib.sha256(before_bytes).hexdigest(),
              "source_after_sha256": hashlib.sha256(after_bytes).hexdigest(),
              "clone_ms": round(clone_ms, 4), "rotations": rotations, "aggregate": aggregate,
              "positive_control": "gcd(0,-2): before=-2, after=2",
              "negative_controls": ["gcd(0,2): before=after=2", "identical AST: EQUIVALENT",
                                    "zero false skips", "semantic invariance across strategy orders"],
              "limitations": ["bounded static interpreter, not upstream runtime execution",
                              "independent observation uses the same INDRO interpreter",
                              "clone, parse and process wall are separately measured shared overhead"],
          }
          (evidence / "summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps({"source": sha, "verdicts": rotations[0]["verdicts"],
                            "aggregate": aggregate, "clone_ms": summary["clone_ms"],
                            "process_wall_ms": [r["wall_ms"] for r in rotations]}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Pinned real-repository counterexample\n\n")
              f.write("TheAlgorithms/Python gcd(0,-2): before=-2, after=2; zero false skips.\n\n")
              f.write("| Strategy | Audit-inclusive sample total ms | Evaluations | Reuses |\n|---|---:|---:|---:|\n")
              for name, m in aggregate.items():
                  f.write(f"| {name} | {m['sample_total_ms']} | {m['evaluations']} | {m['reuses']} |\n")
          PY
      - name: Retain real counterexample and raw cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndra-m4-real-counterexample-cost
          path: ndra-m4-counterexample-evidence/
          if-no-files-found: warn
