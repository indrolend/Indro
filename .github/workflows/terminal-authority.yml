name: Terminal authority integration

on:
  pull_request:
    paths:
      - "packages/digitalbreakdown-terminal/**"
      - ".github/workflows/terminal-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install terminal locked dependencies
        working-directory: packages/digitalbreakdown-terminal
        run: npm ci
      - name: Verify terminal and live PTY authority
        working-directory: packages/digitalbreakdown-terminal
        run: npm test
