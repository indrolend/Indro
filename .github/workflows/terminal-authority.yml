name: Terminal authority integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/digitalbreakdown-terminal/**"
      - ".github/workflows/terminal-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install terminal locked dependencies
        working-directory: packages/digitalbreakdown-terminal
        run: npm ci
      - name: Verify terminal and live PTY authority
        working-directory: packages/digitalbreakdown-terminal
        run: npm test

  terminal-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify PowerShell host
        run: command -v pwsh && pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Install terminal locked dependencies
        working-directory: packages/digitalbreakdown-terminal
        run: npm ci
      - name: Create isolated override project
        run: |
          mkdir -p "$RUNNER_TEMP/indro-terminal-override"
          git -C "$RUNNER_TEMP/indro-terminal-override" init -q
          git -C "$RUNNER_TEMP/indro-terminal-override" -c user.name=INDRO -c user.email=indro@example.invalid commit --allow-empty -qm baseline
      - name: Verify live PTY with alternate project-root override
        working-directory: packages/digitalbreakdown-terminal
        env:
          DB_COMMANDHUD_ROOT: ${{ runner.temp }}/indro-terminal-override
          DB_TERMINAL_EXPECT_COMMANDHUD_ID: local/indro-terminal-override
        run: npm test -- --test-concurrency=1
      - name: Verify real xterm browser and PowerShell OSC provenance
        working-directory: packages/digitalbreakdown-terminal
        run: node --test e2e/browser-xterm-osc.mjs
