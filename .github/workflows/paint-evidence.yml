name: Paint artifact evidence
on:
  pull_request:
    paths:
      - 'packages/indro/paint/**'
      - 'packages/indro/capability/**'
      - '.github/workflows/paint-evidence.yml'
  push:
    branches: [main, fix/paint-evidence-container-validation-20261027]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test packages/indro/paint/artifact.test.mjs packages/indro/capability/store.test.mjs
