name: UAI kernel
on:
  push:
    branches: [feat/uai-transaction-kernel]
  pull_request:
    paths:
      - 'packages/indro/uai/**'
      - 'packages/indro/workbench*.mjs'
      - 'packages/indro/cli.mjs'
      - 'packages/indro/fl/**'
      - 'packages/indro/capability/**'
      - 'experiments/fl-capability-transfer-20261026/benchmark*.mjs'
      - '.github/workflows/uai-kernel.yml'
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/indro/uai/*.test.mjs packages/indro/workbench.test.mjs
      - run: node --test experiments/fl-capability-transfer-20261026/benchmark.test.mjs
      - run: node --test packages/indro/fl/*.test.mjs packages/indro/capability/*.test.mjs
      - run: node packages/indro/cli.mjs work help
      - run: node packages/indro/cli.mjs app help
      - run: node packages/indro/cli.mjs app fixture set 0.75 --json
