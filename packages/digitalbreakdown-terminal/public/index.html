<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Breakdown Terminal</title>
<link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
<style>
@font-face {
  font-family: "Digital Breakdown Grid V3";
  src: url("/fonts/DigitalBreakdownGridV3-Regular.ttf") format("truetype");
  font-style: normal;
  font-weight: 400;
  font-display: block;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #00191d;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  color: #72e6c7;
  font-family: Consolas, monospace;
}

header {
  padding: 14px 22px;
  border-bottom: 1px solid #23575a;
  letter-spacing: 2px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

#copy-dock {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  letter-spacing: 1px;
}

#evidence-toggle {
  border: 1px solid #28666d;
  border-radius: 999px;
  padding: 5px 10px;
  color: #72e6c7;
  background: rgba(0, 25, 29, 0.76);
  font: 11px/1 Consolas, monospace;
  letter-spacing: 1px;
  cursor: pointer;
}

#evidence-toggle:hover,
#evidence-toggle:focus-visible { color: #00191d; background: #72e6c7; outline: none; }

#copy-dock button {
  border: 1px solid #28666d;
  border-radius: 999px;
  padding: 5px 10px;
  color: #72e6c7;
  background: rgba(0, 25, 29, 0.76);
  font: 11px/1 Consolas, monospace;
  letter-spacing: 1px;
  cursor: pointer;
}

#copy-dock button:hover:not(:disabled),
#copy-dock button:focus-visible {
  color: #00191d;
  background: #72e6c7;
  outline: none;
}

#copy-dock button:disabled {
  cursor: default;
  opacity: 0.35;
}

#copy-status {
  min-width: 11ch;
  overflow: hidden;
  color: #58aeb0;
  font: 11px/1 Consolas, monospace;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#terminal {
  position: absolute;
  inset: 0;
  z-index: 1;
  min-height: 0;
  padding: 12px;
  box-sizing: border-box;
}

#buoyant-field {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

main {
  position: relative;
  flex: 1;
  min-height: 0;
}

#evidence-panel {
  position: absolute;
  z-index: 3;
  top: 14px;
  right: 14px;
  width: min(380px, calc(100% - 28px));
  max-height: calc(100% - 28px);
  overflow: auto;
  box-sizing: border-box;
  border: 1px solid #28666d;
  border-radius: 8px;
  padding: 14px;
  color: #b4f6e6;
  background: rgba(0, 25, 29, 0.95);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
  font: 12px/1.45 Consolas, monospace;
}

#evidence-panel[hidden] { display: none; }
#evidence-panel h2 { margin: 0 0 5px; color: #72e6c7; font-size: 13px; letter-spacing: 1px; }
#evidence-panel p { margin: 5px 0; color: #72aeb0; }
#evidence-list { margin: 12px 0 0; padding: 0; list-style: none; }
#evidence-list li { border-top: 1px solid rgba(40, 102, 109, 0.65); padding: 8px 0; }
#evidence-list strong { color: #74ffbd; font-weight: normal; }
#evidence-panel button { float: right; border: 0; color: #72e6c7; background: transparent; font: inherit; cursor: pointer; }
#evidence-panel .evidence-expand { float: none; margin-top: 7px; border: 1px solid #28666d; border-radius: 999px; padding: 3px 7px; font-size: 10px; letter-spacing: 1px; }
#evidence-panel .evidence-expand:hover, #evidence-panel .evidence-expand:focus-visible { background: #72e6c7; color: #00191d; outline: none; }
#evidence-detail { position: fixed; z-index: 4; inset: auto 18px 18px auto; width: min(680px, calc(100vw - 36px)); max-height: min(52vh, 540px); overflow: auto; box-sizing: border-box; border: 1px solid #4d9f9f; border-radius: 8px; padding: 14px; color: #c9fff0; background: rgba(0, 19, 23, .98); box-shadow: 0 20px 70px rgba(0,0,0,.55); font: 12px/1.4 Consolas, monospace; }
#evidence-detail[hidden] { display: none; }
#evidence-detail h2 { margin: 0 24px 9px 0; color: #74ffbd; font-size: 12px; letter-spacing: 1px; }
#evidence-detail h3 { margin: 13px 0 4px; color: #72aeb0; font-size: 11px; font-weight: normal; letter-spacing: 1px; }
#evidence-detail pre { margin: 0; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #b4f6e6; }
#evidence-detail button { position: absolute; top: 11px; right: 12px; border: 0; color: #72e6c7; background: transparent; cursor: pointer; font: 18px/1 monospace; }
#semantic-morph-layer { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.semantic-morph-stage { position: fixed; left: var(--from-x); top: var(--from-y); width: var(--to-width); color: #dff59a; font: 12px/1.2 "Digital Breakdown Grid V3", Consolas, monospace; letter-spacing: 1px; text-shadow: 0 0 14px #72e6c7; animation: semantic-stage 440ms cubic-bezier(.2,.7,.2,1) both; }
.semantic-morph-glyph { display: block; overflow: hidden; white-space: nowrap; }
.semantic-morph-glyph[data-phase="2"] { color: #dff59a; filter: blur(.35px); }
@keyframes semantic-stage { to { left: var(--to-x); top: var(--to-y); opacity: .2; transform: translateY(-8px) scale(1.03); } }

@media (prefers-reduced-motion: reduce) {
  #buoyant-field { display: none; }
}
</style>
</head>
<body>
<header>
  <span>DIGITAL BREAKDOWN // SIGNAL ACTIVE</span>
  <button id="evidence-toggle" type="button" aria-expanded="false" aria-controls="evidence-panel">EVIDENCE</button>
  <nav id="copy-dock" aria-label="Clipboard tools">
    <span id="copy-status" aria-live="polite">NO SELECTION</span>
    <button id="copy-raw" type="button" disabled>COPY RAW</button>
    <button id="copy-fenced" type="button" disabled>COPY FENCED</button>
    <button id="paste" type="button">PASTE</button>
  </nav>
</header>
<main>
  <canvas id="buoyant-field" aria-hidden="true"></canvas>
  <div id="terminal"></div>
  <aside id="evidence-panel" hidden aria-live="polite">
    <button id="evidence-close" type="button" aria-label="Close evidence">×</button>
    <h2>RETAINED EVIDENCE</h2>
    <p id="evidence-repository">Loading read-only projection…</p>
    <ul id="evidence-list"></ul>
  </aside>
  <section id="evidence-detail" hidden aria-live="polite" aria-label="Expanded retained evidence">
    <button id="evidence-detail-close" type="button" aria-label="Close expanded evidence">×</button>
    <h2 id="evidence-detail-title">RETAINED EVIDENCE</h2>
    <div id="evidence-detail-body"></div>
  </section>
  <div id="semantic-morph-layer" aria-hidden="true"></div>
</main>
<script type="module" src="/client.js"></script>
</body>
</html>
